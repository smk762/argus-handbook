name: Deploy

# Publishes the site (docs.dragonhound.dev, Cloudflare Pages project
# argus-handbook) from every dev commit that passed CI. Production is the Pages
# branch `main`; a deploy with any other --branch is only a preview.
#
# Needs two repo secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages >
# Edit) and CLOUDFLARE_ACCOUNT_ID. Without them the job builds, then skips the
# upload with a notice, so nothing fails before they are set. The first deploy
# creates the Pages project if it is missing; the custom domain
# docs.dragonhound.dev is attached to it by hand, so until then the smoke check
# falls back to argus-handbook.pages.dev.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# The newest dev commit wins; an older deploy still queued is pointless.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: argus-handbook
  WRANGLER: wrangler@4.162.0

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built ${SHA::7} but did not deploy."

      # Idempotent: creates the project on the first deploy, then finds it.
      - if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "$WRANGLER" pages project list | tee "$RUNNER_TEMP/projects.txt"
          if grep -qw "$PROJECT" "$RUNNER_TEMP/projects.txt"; then
            echo "Pages project $PROJECT exists."
          else
            echo "::notice::Creating the Cloudflare Pages project $PROJECT (production branch main)."
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi

      - if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy out
          --project-name "$PROJECT" --branch main
          --commit-hash "$SHA" --commit-message "dev ${SHA::7}"

      # The deploy is only done when the site serves it. The custom domain is
      # attached by hand, so until it serves the site, check the pages.dev host.
      - if: env.HAS_TOKEN == 'true'
        run: |
          probe() { curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 5 --retry-delay 6 --retry-all-errors "$1" || true; }
          base=https://docs.dragonhound.dev
          if [ "$(probe "$base/")" != 200 ]; then
            echo "::notice::$base does not serve the site yet (custom domain not attached?); checking https://$PROJECT.pages.dev instead."
            base="https://$PROJECT.pages.dev"
          fi
          for path in / /setup/ /packages/lens/; do
            code=$(probe "$base$path")
            echo "$code $base$path"; [ "$code" = 200 ] || exit 1
          done
